<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caitlin Adams</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #555555;
    --link: #1a5fb4;
    --border: #dddddd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #14161a;
      --muted: #a8a8a8;
      --link: #7aa2f7;
      --border: #333333;
    }
  }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--fg);
    background: var(--bg);
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.6;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .header img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--border);
    flex-shrink: 0;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 0.3rem 0;
  }
  .contact {
    color: var(--muted);
    font-size: 0.95rem;
  }
  p {
    margin: 1.2rem 0;
  }
  a {
    color: var(--link);
  }
  .links {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .links ul {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0 0 0;
  }
  .links li {
    margin-bottom: 0.4rem;
  }
</style>
</head>
<body>

  <div class="header">
    <img src="assets/photo.jpg" alt="Caitlin Adams" onerror="this.style.display='none'">
    <div>
      <h1>Caitlin Adams</h1>
      <div class="contact">London, UK &nbsp;|&nbsp; caitlinadams@ymail.com</div>
    </div>
  </div>

  <p>
    Hi I'm Caitlin - thanks for finding your way here. This website is work in progress, in the meantime have a sneek peek at my <a href="assets/CaitlinAdams_CV.pdf">CV</a>.
  </p>

</body>
</html>
